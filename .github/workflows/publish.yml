---
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.goarch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            os: linux
            goarch: amd64
            cc: gcc
            plat: manylinux_2_17_x86_64
          - runs-on: ubuntu-latest
            os: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            plat: manylinux_2_17_aarch64
          - runs-on: macos-latest
            os: darwin
            goarch: amd64
            cc: gcc
            plat: macosx_12_0_x86_64
          - runs-on: macos-latest
            os: darwin
            goarch: arm64
            cc: gcc
            plat: macosx_12_0_arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/libs/logql-to-logsql-go/go.mod
          cache-dependency-path: src/libs/logql-to-logsql-go/go.sum

      - name: Install cross-compiler (linux/arm64)
        if: matrix.os == 'linux' && matrix.goarch == 'arm64'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build .so
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          cd src/libs/logql-to-logsql-go
          go mod download
          go build -buildmode=c-shared -o ../../../src/logql_to_logsql/libs/logql_to_logsql_go.so .
          rm -f ../../../src/logql_to_logsql/libs/logql_to_logsql_go.h

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build wheel
        run: |
          pip install build wheel
          python -m build --wheel
          wheel tags --remove --platform-tag ${{ matrix.plat }} dist/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.goarch }}
          path: dist/*.whl

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wheel-linux-amd64
          path: dist/

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install wheel and test dependencies
        run: pip install dist/*.whl pytest

      - name: Run tests
        run: pytest tests/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
